name: SMB feature compile test

on:
  push:
    branches:
      - smb-test-mpv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"
      - name: Apply project modifications
        run: |
          chmod +x ./gradlew
          bash mod/apply.sh
      - name: Compile mobile and TV Java sources
        run: |
          ./gradlew \
            :app:compileMobileArm64_v8aDebugJavaWithJavac \
            :app:compileLeanbackArm64_v8aDebugJavaWithJavac \
            --no-daemon
