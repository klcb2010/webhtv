name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, blank = v<versionName>-yyyyMMddHHmm or v<versionName>-beta-yyyyMMddHHmm"
        required: false
        type: string
      release_channel:
        description: "Release channel, auto uses beta on fongmi-sync"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - beta
      release_notes:
        description: "Release notes, use \\n for Markdown newlines"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      sync_cnb:
        description: "Mirror APKs to CNB Release and sync CNB manifests"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  CNB_API_ENDPOINT: https://api.cnb.cool
  CNB_WEB_ENDPOINT: https://cnb.cool
  CNB_REPO_SLUG: fish2035/webhtv-release
  CNB_REPO_URL: https://cnb.cool/fish2035/webhtv-release.git

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Apply mod patches
      # ============================================================
      - name: Apply mod patches
        run: |
          if [ -f mod/apply.sh ]; then
            bash mod/apply.sh
          else
            echo "No mod/apply.sh, skip"
          fi

      # ============================================================
      # Patch detail_title format args (safe sequential replace)
      # ============================================================
      - name: Patch detail_title format
        run: |
          find . -name "strings.xml" -type f -print0 | while IFS= read -r -d '' f; do
            # only touch lines with name="detail_title" that still use bare %s
            if grep -q 'name="detail_title"' "$f"; then
              python3 - <<'PY' "$f"
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          def fix(m):
              body = m.group(0)
              # replace first two %s with %1$s / %2$s if not already positional
              if "%1$s" in body:
                  return body
              n = 0
              def repl(_):
                  nonlocal n
                  n += 1
                  return f"%{n}$s" if n <= 2 else "%s"
              return re.sub(r"%s", repl, body)
          text2 = re.sub(
              r'<string\s+name="detail_title"[^>]*>.*?</string>',
              fix,
              text,
              flags=re.S,
          )
          if text2 != text:
              open(path, "w", encoding="utf-8").write(text2)
              print("patched", path)
          PY
            fi
          done

      # ============================================================
      # JDK 21
      # ============================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ============================================================
      # Python 3.10
      # ============================================================
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # MPV Native — arm64 only (upstream v7a currently fails string check)
      # ============================================================
      - name: Verify bundled MPV native assets (arm64 only)
        run: |
          # Upstream armeabi-v7a libmpv.so is missing required DV7 P8.1 string.
          # Temporarily verify arm64 only; restore full script when upstream fixes v7a.
          set -euo pipefail
          if [ -f scripts/verify_mpv_native_assets.sh ]; then
            # Prefer running full script but skip v7a by commenting at runtime
            cp scripts/verify_mpv_native_assets.sh /tmp/verify_mpv_native_assets.sh
            sed -i 's/^verify_abi armeabi-v7a/# verify_abi armeabi-v7a/' /tmp/verify_mpv_native_assets.sh
            bash /tmp/verify_mpv_native_assets.sh --require-elf
          else
            echo "No verify script, skip"
          fi

      # ============================================================
      # Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      # ============================================================
      # WebSocket Danmaku tests
      # ============================================================
      - name: Run WebSocket danmaku tests
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:testMobileArm64_v8aDebugUnitTest \
            --tests 'com.fongmi.android.tv.player.danmaku.*' \
            --no-daemon

      # ============================================================
      # Resolve release tag
      # ============================================================
      - name: Resolve release tag
        id: meta
        run: |
          VERSION_NAME="$(
            sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1
          )"
          VERSION_CODE="$(
            sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1
          )"

          CHANNEL="${{ inputs.release_channel }}"
          if [ "$CHANNEL" = "auto" ] || [ -z "$CHANNEL" ]; then
            if [ "${{ github.ref_name }}" = "fongmi-sync" ]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi

          if [ "$CHANNEL" = "beta" ]; then
            APK_SUFFIX="-beta"
            TAG_PATTERN="^v${VERSION_NAME}-beta-[0-9]{12}$"
            TAG_DEFAULT="v${VERSION_NAME}-beta-$(date +%Y%m%d%H%M)"
            TAG_EXPECT="v${VERSION_NAME}-beta-yyyyMMddHHmm"
          else
            APK_SUFFIX=""
            TAG_PATTERN="^v${VERSION_NAME}-[0-9]{12}$"
            TAG_DEFAULT="v${VERSION_NAME}-$(date +%Y%m%d%H%M)"
            TAG_EXPECT="v${VERSION_NAME}-yyyyMMddHHmm"
          fi

          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$TAG_DEFAULT"
          fi

          if ! printf '%s' "$TAG" | grep -Eq "$TAG_PATTERN"; then
            echo "::error title=Invalid release tag::Expected $TAG_EXPECT, got: $TAG"
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error title=Release tag exists::$TAG already exists"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "title=${TAG#v}"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
            echo "channel=$CHANNEL"
            echo "apk_suffix=$APK_SUFFIX"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # Configure release signing (single place)
      # ============================================================
      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_BASE64="${RELEASE_KEYSTORE_BASE64:-$KEYSTORE_BASE64}"
          STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-$KEY_PASSWORD}"
          ALIAS="${RELEASE_KEY_ALIAS:-$KEY_ALIAS}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-$STORE_PASSWORD}"

          if [ -z "${KS_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${ALIAS:-}" ]; then
            echo "::error title=Release signing not configured::Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEY_ALIAS and RELEASE_STORE_PASSWORD."
            exit 1
          fi

          mkdir -p app/signing
          printf '%s' "$KS_BASE64" | tr -d '\n ' | base64 --decode > app/signing/release.jks

          if [ ! -s app/signing/release.jks ]; then
            echo "❌ decoded JKS is empty"
            exit 1
          fi

          ABS_JKS_PATH="$GITHUB_WORKSPACE/app/signing/release.jks"
          if ! keytool -list -keystore "$ABS_JKS_PATH" -storepass "$STORE_PASSWORD" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "❌ keystore verification failed for alias: $ALIAS"
            keytool -list -keystore "$ABS_JKS_PATH" -storepass "$STORE_PASSWORD" | grep "PrivateKeyEntry" || true
            exit 1
          fi

          {
            echo "storeFile=$ABS_JKS_PATH"
            echo "keyAlias=$ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASS"
          } > local.properties

          echo "✅ Release signing configured"

      # ============================================================
      # Build four release APKs
      # ============================================================
      - name: Build four release APKs
        env:
          WEBHTV_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          WEBHTV_APK_SUFFIX: ${{ steps.meta.outputs.apk_suffix }}
        run: |
          chmod +x ./gradlew
          rm -rf Release/apk
          ./gradlew \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleMobileArmeabi_v7aRelease \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleLeanbackArmeabi_v7aRelease \
            --no-daemon

      # ============================================================
      # Collect artifacts
      # ============================================================
      - name: Collect artifacts
        run: |
          rm -rf dist
          mkdir -p dist
          cp Release/apk/*.apk dist/
          echo "APK:"
          ls -lh dist/

      # ============================================================
      # Prepare release notes
      # ============================================================
      - name: Prepare release notes input
        id: release_notes
        env:
          RELEASE_NOTES_RAW: ${{ inputs.release_notes }}
        run: |
          python3 - <<'PY'
          import os
          raw = os.environ.get("RELEASE_NOTES_RAW", "").strip()
          notes = (
              raw.replace("\\r\\n", "\n")
                 .replace("\\n", "\n")
                 .replace("\\t", "\t")
                 .replace('\\"', '"')
                 .replace("\\'", "'")
          )
          delimiter = "RELEASE_NOTES_EOF"
          while delimiter in notes:
              delimiter += "_"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_notes={'true' if notes else 'false'}\n")
              fh.write(f"notes<<{delimiter}\n")
              fh.write(notes)
              if notes and not notes.endswith("\n"):
                  fh.write("\n")
              fh.write(f"{delimiter}\n")
          PY

      # ============================================================
      # Generate update manifests
      # ============================================================
      - name: Generate update manifests
        env:
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
          GITHUB_RELEASE_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os
          tag = "${{ steps.meta.outputs.tag }}"
          notes = os.environ.get("RELEASE_NOTES", "").strip()
          release_download_base = os.environ["GITHUB_RELEASE_DOWNLOAD_BASE"]
          for apk in glob.glob("dist/*.apk"):
              base = os.path.splitext(os.path.basename(apk))[0]
              with open(apk, "rb") as fh:
                  content = fh.read()
              data = {
                  "name": tag,
                  "desc": f"{tag} - ${{ steps.meta.outputs.short_sha }}",
                  "channel": "${{ steps.meta.outputs.channel }}",
                  "code": int("${{ steps.meta.outputs.version_code }}"),
                  "apk": f"{release_download_base}/{base}.apk",
                  "size": len(content),
                  "sha256": hashlib.sha256(content).hexdigest(),
              }
              if notes:
                  data["notes"] = notes
              with open(f"dist/{base}.json", "w", encoding="utf-8") as fh:
                  json.dump(data, fh, ensure_ascii=False, indent=2)
                  fh.write("\n")
          print("manifests:")
          for p in sorted(glob.glob("dist/*")):
              print(p)
          PY
          ls -lh dist/

      # ============================================================
      # Create GitHub Release on THIS repo only
      # ============================================================
      - name: Create GitHub Release
        env:
          # Prefer PAT if you need extra scopes; fall back to GITHUB_TOKEN
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ] || [ "${{ steps.meta.outputs.channel }}" = "beta" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          NOTES="${RELEASE_NOTES:-手动触发 GitHub Actions 构建发布。}"
          echo "目标仓库: ${GITHUB_REPOSITORY}"
          echo "Tag: ${{ steps.meta.outputs.tag }}"
          gh release create \
            "${{ steps.meta.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes "$NOTES" \
            $PRERELEASE_FLAG \
            dist/*.apk \
            dist/*.json

      # ============================================================
      # Sync to CNB (optional)
      # ============================================================
      - name: Sync to CNB
        if: ${{ inputs.sync_cnb }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          CNB_RELEASE_TITLE: ${{ steps.meta.outputs.title }}
          CNB_RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
          CNB_RELEASE_PRERELEASE: ${{ inputs.prerelease == true || steps.meta.outputs.channel == 'beta' }}
          CNB_RELEASE_LATEST: ${{ steps.meta.outputs.channel == 'stable' }}
        run: |
          if [ -f .github/scripts/sync-cnb-release.sh ]; then
            .github/scripts/sync-cnb-release.sh
          else
            echo "No CNB sync script, skip"
          fi

      # ============================================================
      # Upload workflow artifacts
      # ============================================================
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-${{ steps.meta.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
