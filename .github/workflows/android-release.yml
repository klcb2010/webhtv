name: Android Release

on:
  schedule:
    # 每天6小时检查是否需要打包
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, blank = v<versionName>-yyyyMMddHHmm or v<versionName>-beta-yyyyMMddHHmm"
        required: false
        type: string
      release_channel:
        description: "Release channel, auto uses beta on fongmi-sync"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - beta
      release_notes:
        description: "Release notes, use \\n for Markdown newlines"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      sync_cnb:
        description: "Mirror APKs to CNB Release and sync CNB manifests"
        required: false
        default: false
        type: boolean
      force_build:
        description: "Force build even if upstream has no new Release (manual only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

  CNB_API_ENDPOINT: https://api.cnb.cool
  CNB_WEB_ENDPOINT: https://cnb.cool
  CNB_REPO_SLUG: fish2035/webhtv-release
  CNB_REPO_URL: https://cnb.cool/fish2035/webhtv-release.git

  UPSTREAM_REPO: https://github.com/fish2018/webhtv.git
  UPSTREAM_BRANCH: main

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Check and sync upstream
        id: upstream_sync
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          set -e

          echo "synced=false" >> "$GITHUB_OUTPUT"
          echo "reason=init" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "检查上游更新"
          echo "=========================================="
          echo "当前仓库 : ${GITHUB_REPOSITORY}"
          echo "当前分支 : ${GITHUB_REF_NAME}"
          echo "上游仓库 : ${UPSTREAM_REPO}"
          echo "上游分支 : ${UPSTREAM_BRANCH}"
          echo "=========================================="

          CURRENT_BRANCH="${GITHUB_REF_NAME}"
          if [ -z "$CURRENT_BRANCH" ]; then
            echo "❌ 无法确定当前分支"
            exit 1
          fi

          echo ""
          echo "当前 Git remote："
          git remote -v

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_REPO"

          echo ""
          echo "=========================================="
          echo "获取上游源码"
          echo "=========================================="

          git fetch --no-tags --prune upstream "$UPSTREAM_BRANCH"

          CURRENT_SHA="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse "upstream/$UPSTREAM_BRANCH")"

          echo ""
          echo "当前 HEAD : $CURRENT_SHA"
          echo "上游 HEAD : $UPSTREAM_SHA"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo ""
            echo "=========================================="
            echo "✅ 上游没有新的提交"
            echo "=========================================="
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=upstream-already-merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "⚠️ 检测到上游更新"
          echo "=========================================="
          echo ""
          echo "上游新增提交："
          git log --oneline --decorate HEAD.."upstream/$UPSTREAM_BRANCH" | head -30 || true

          echo ""
          echo "=========================================="
          echo "检查上游是否已发布就绪（按 Release 提交，而非发布时间）"
          echo "=========================================="

          # 取最新非 draft Release（含 prerelease）
          RELEASE_JSON="$(
            gh api "repos/fish2018/webhtv/releases?per_page=10" \
              --jq '[.[] | select(.draft == false)] | .[0] // empty' \
              2>/dev/null || true
          )"

          if [ -z "$RELEASE_JSON" ] || [ "$RELEASE_JSON" = "null" ]; then
            echo "⏳ 上游尚无可用 GitHub Release → 跳过同步"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-upstream-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_TAG="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("tag_name") or "")')"
          RELEASE_PUBLISHED_AT="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("published_at") or d.get("created_at") or "")')"
          RELEASE_PRERELEASE="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("true" if d.get("prerelease") else "false")')"

          echo "最新 Release     : $RELEASE_TAG"
          echo "Release 发布时间 : $RELEASE_PUBLISHED_AT"
          echo "是否预发布       : $RELEASE_PRERELEASE"
          echo "上游 main HEAD   : $UPSTREAM_SHA"

          if [ -z "$RELEASE_TAG" ]; then
            echo "⏳ 无法解析 Release tag → 跳过同步"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=bad-release-tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 拉取该 tag 对应 commit（关键：用提交包含关系，不用 published_at）
          git fetch --no-tags upstream "refs/tags/${RELEASE_TAG}:refs/tags/upstream-rel-${RELEASE_TAG}" 2>/dev/null || \
            git fetch upstream "refs/tags/${RELEASE_TAG}:refs/tags/upstream-rel-${RELEASE_TAG}" 2>/dev/null || true

          REL_SHA=""
          if git rev-parse "upstream-rel-${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            REL_SHA="$(git rev-parse "upstream-rel-${RELEASE_TAG}^{commit}")"
          elif git rev-parse "upstream-rel-${RELEASE_TAG}" >/dev/null 2>&1; then
            REL_SHA="$(git rev-parse "upstream-rel-${RELEASE_TAG}")"
          else
            # API 回退：target_commitish 有时是分支名，尽量解析 tag object
            REL_SHA="$(
              gh api "repos/fish2018/webhtv/git/ref/tags/${RELEASE_TAG}" \
                --jq '.object.sha' 2>/dev/null || true
            )"
            OBJ_TYPE="$(
              gh api "repos/fish2018/webhtv/git/ref/tags/${RELEASE_TAG}" \
                --jq '.object.type' 2>/dev/null || true
            )"
            if [ "$OBJ_TYPE" = "tag" ] && [ -n "$REL_SHA" ]; then
              REL_SHA="$(
                gh api "repos/fish2018/webhtv/git/tags/${REL_SHA}" \
                  --jq '.object.sha' 2>/dev/null || echo "$REL_SHA"
              )"
            fi
          fi

          echo "Release 指向 SHA : ${REL_SHA:-unknown}"

          if [ -z "$REL_SHA" ]; then
            echo "⏳ 无法解析 Release 对应提交 → 跳过同步"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=cannot-resolve-release-sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 就绪条件：上游 main HEAD 已被该 Release 包含（HEAD == Release 或 HEAD 是 Release 的祖先）
          # 未就绪：main 比 Release 更新（Release 是 main 的祖先但不相等）
          if [ "$UPSTREAM_SHA" = "$REL_SHA" ]; then
            echo "✅ 上游 main HEAD 与最新 Release 提交一致 → 就绪"
          elif git merge-base --is-ancestor "$UPSTREAM_SHA" "$REL_SHA" 2>/dev/null; then
            echo "✅ 上游 main HEAD 已包含在最新 Release 中 → 就绪"
          elif git merge-base --is-ancestor "$REL_SHA" "$UPSTREAM_SHA" 2>/dev/null; then
            echo ""
            echo "=========================================="
            echo "⏳ 上游 main 比最新 Release 更新（仅源码、尚未对该提交发版）"
            echo "跳过同步，等待 fish2018 发布对应 Release"
            echo "=========================================="
            echo "main    : $UPSTREAM_SHA"
            echo "release : $REL_SHA ($RELEASE_TAG)"
            git log --oneline "$REL_SHA".."$UPSTREAM_SHA" | head -20 || true
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=main-ahead-of-release" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "⏳ 上游 main 与最新 Release 分叉 → 跳过同步"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=diverged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "✅ 上游已就绪，开始同步"
          echo "=========================================="

          rm -rf /tmp/webhtv-protected
          mkdir -p /tmp/webhtv-protected

          echo ""
          echo "=========================================="
          echo "保护本地文件"
          echo "=========================================="

          if [ -f README.md ]; then
            cp -a README.md /tmp/webhtv-protected/README.md
            echo "🔒 README.md"
          fi

          if [ -d mod ]; then
            cp -a mod /tmp/webhtv-protected/mod
            echo "🔒 mod/"
          fi

          if [ -f .github/workflows/android-release.yml ]; then
            mkdir -p /tmp/webhtv-protected/workflows
            cp -a .github/workflows/android-release.yml \
              /tmp/webhtv-protected/workflows/android-release.yml
            echo "🔒 .github/workflows/android-release.yml"
          fi

          rm -rf /tmp/webhtv-upstream
          mkdir -p /tmp/webhtv-upstream
          git archive "upstream/$UPSTREAM_BRANCH" | tar -x -C /tmp/webhtv-upstream

          echo ""
          echo "=========================================="
          echo "同步上游源码"
          echo "=========================================="

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='README.md' \
            --exclude='mod/' \
            --exclude='.github/workflows/android-release.yml' \
            /tmp/webhtv-upstream/ \
            ./

          if [ -f /tmp/webhtv-protected/README.md ]; then
            cp -a /tmp/webhtv-protected/README.md README.md
            echo "🔒 已恢复 README.md"
          fi

          if [ -d /tmp/webhtv-protected/mod ]; then
            rm -rf mod
            cp -a /tmp/webhtv-protected/mod mod
            echo "🔒 已恢复 mod/"
          fi

          if [ -f /tmp/webhtv-protected/workflows/android-release.yml ]; then
            mkdir -p .github/workflows
            cp -a /tmp/webhtv-protected/workflows/android-release.yml \
              .github/workflows/android-release.yml
            echo "🔒 已恢复 .github/workflows/android-release.yml"
          fi

          git add -A

          echo ""
          echo "=========================================="
          echo "检查实际文件变化"
          echo "=========================================="

          if git diff --cached --quiet; then
            echo "✅ 保护文件后没有实际变化，跳过提交"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-file-change-after-protect" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo "实际变化："
          git diff --cached --stat
          git diff --cached --name-status

          echo ""
          echo "=========================================="
          echo "检查保护文件"
          echo "=========================================="

          PROTECTED_CHANGED=0
          if git diff --cached --quiet -- README.md; then
            echo "✅ README.md 未被修改"
          else
            echo "❌ README.md 被修改"
            PROTECTED_CHANGED=1
          fi
          if git diff --cached --quiet -- mod/; then
            echo "✅ mod/ 未被修改"
          else
            echo "❌ mod/ 被修改"
            PROTECTED_CHANGED=1
          fi
          if git diff --cached --quiet -- .github/workflows/android-release.yml; then
            echo "✅ android-release.yml 未被修改"
          else
            echo "❌ android-release.yml 被修改"
            PROTECTED_CHANGED=1
          fi

          if [ "$PROTECTED_CHANGED" -ne 0 ]; then
            echo "❌ 保护文件检测失败，停止提交"
            git reset
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: sync upstream fish2018/webhtv (${RELEASE_TAG})"

          echo ""
          echo "=========================================="
          echo "推送到当前仓库"
          echo "=========================================="

          git push origin "HEAD:$CURRENT_BRANCH"

          echo "synced=true" >> "$GITHUB_OUTPUT"
          echo "reason=synced-${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "upstream_release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "✅ 上游同步完成并已提交"
          echo "=========================================="

      - name: Decide whether to build
        id: should_build
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          set -e
          export TZ=Asia/Shanghai
          TODAY="$(date +%Y-%m-%d)"
          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_SHORT="$(git rev-parse --short=7 HEAD)"
          EVENT="${{ github.event_name }}"
          SYNCED="${{ steps.upstream_sync.outputs.synced }}"
          SYNC_REASON="${{ steps.upstream_sync.outputs.reason }}"
          FORCE="${{ inputs.force_build }}"

          echo "=========================================="
          echo "本仓库发布检测"
          echo "=========================================="
          echo "仓库 : ${GITHUB_REPOSITORY}"
          echo "HEAD : $HEAD_SHA ($HEAD_SHORT)"
          echo "日期 : $TODAY (Asia/Shanghai)"
          echo "触发 : $EVENT"
          echo "上游同步 : synced=$SYNCED reason=$SYNC_REASON"
          echo "=========================================="

          # 定时任务：仅当「本轮成功同步了已发版的上游」才打包
          # 避免：上游只推源码未发 Release 时误打包，或无同步却重复发版
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SYNCED" != "true" ]; then
              echo "定时任务且本轮未同步上游 → 跳过打包"
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "reason=schedule-no-upstream-sync" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "定时任务且本轮已同步就绪上游 → 继续打包检测"
          fi

          # 手动 force_build
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "手动强制打包"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=force-build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_JSON="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=10" \
              --jq '[.[] | select(.draft == false)] | .[0] // empty' \
              2>/dev/null || true
          )"

          if [ -z "$LATEST_JSON" ] || [ "$LATEST_JSON" = "null" ]; then
            echo "尚无 Release → 需要打包"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=no-release-yet" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="$(printf '%s' "$LATEST_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name") or "")')"
          PUBLISHED_AT="$(printf '%s' "$LATEST_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("published_at") or d.get("created_at") or "")')"
          echo "最新 Release : $TAG"
          echo "发布时间     : $PUBLISHED_AT"

          REL_SHA=""
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            REL_SHA="$(git rev-parse "$TAG^{commit}" 2>/dev/null || git rev-parse "$TAG")"
          fi
          if [ -z "$REL_SHA" ]; then
            REL_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
            OBJ_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.type' 2>/dev/null || true)"
            if [ "$OBJ_TYPE" = "tag" ] && [ -n "$REL_SHA" ]; then
              REL_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$REL_SHA" --jq '.object.sha' 2>/dev/null || echo "$REL_SHA")"
            fi
          fi
          echo "Release SHA  : ${REL_SHA:-unknown}"

          if [ -n "$REL_SHA" ] && [ "$REL_SHA" = "$HEAD_SHA" ]; then
            echo "HEAD 与最新 Release 相同 → 跳过打包"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "reason=head-already-released" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$REL_SHA" ] && git merge-base --is-ancestor "$HEAD_SHA" "$REL_SHA" 2>/dev/null; then
            echo "HEAD 是最新 Release 的祖先（无更新）→ 跳过"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-commits-after-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "存在未发布提交 → 需要打包"
          if [ -n "$REL_SHA" ]; then
            echo "Release 之后的提交："
            git log --oneline "$REL_SHA"..HEAD | head -20 || true
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "reason=unreleased-commits" >> "$GITHUB_OUTPUT"

      - name: Skip remaining steps when no build needed
        if: steps.should_build.outputs.build != 'true'
        run: |
          echo "=========================================="
          echo "跳过打包：${{ steps.should_build.outputs.reason }}"
          echo "上游同步：${{ steps.upstream_sync.outputs.reason }}"
          echo "=========================================="

      # ============================================================
      # Apply mod patches
      # ============================================================
      - name: Apply mod patches
        if: steps.should_build.outputs.build == 'true'
        run: |
          if [ -f mod/apply.sh ]; then
            bash mod/apply.sh
          else
            echo "No mod/apply.sh, skip"
          fi

      # ============================================================
      # Prepare Signing and Patch Resources
      # ============================================================
      - name: Prepare Signing and Patch Resources
        if: steps.should_build.outputs.build == 'true'
        env:
          B64_DATA: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          find . \
            -name "strings.xml" \
            -type f \
            -exec sed -i \
            '/name="detail_title"/s/%s/%1$s/1' {} +

          find . \
            -name "strings.xml" \
            -type f \
            -exec sed -i \
            '/name="detail_title"/s/%s/%2$s/1' {} +

          mkdir -p app/signing

          echo "$B64_DATA" \
            | tr -d '\n ' \
            | base64 -d \
            > app/signing/release.jks

          ABS_JKS_PATH=$(pwd)/app/signing/release.jks

          if [ ! -s app/signing/release.jks ]; then
            echo "❌ 错误：解码后的 JKS 文件为空"
            exit 1
          fi

          echo "==== 正在验证密钥库访问权限 ===="

          if ! keytool \
            -list \
            -keystore "$ABS_JKS_PATH" \
            -storepass "$PASS" \
            -alias "$ALIAS" \
            > /dev/null 2>&1; then

            echo "❌ 验证失败：密码或别名不正确"
            echo "当前尝试别名: $ALIAS"
            echo ""
            echo "JKS 中真实的别名列表如下："

            keytool \
              -list \
              -keystore "$ABS_JKS_PATH" \
              -storepass "$PASS" \
              | grep "PrivateKeyEntry" || true

            exit 1
          fi

          echo "✅ JKS 验证通过"

          cat > local.properties <<EOF
          storeFile=$ABS_JKS_PATH
          keyAlias=$ALIAS
          storePassword=$PASS
          keyPassword=$PASS
          EOF

      # ============================================================
      # JDK 21
      # ============================================================
      - name: Set up JDK 21
        if: steps.should_build.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ============================================================
      # Python 3.10
      # ============================================================
      - name: Set up Python 3.10
        if: steps.should_build.outputs.build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # MPV Native
      # ============================================================
      - name: Verify bundled MPV native assets
        if: steps.should_build.outputs.build == 'true'
        run: |
          bash scripts/verify_mpv_native_assets.sh --require-elf

      # ============================================================
      # Android SDK
      # ============================================================
      - name: Set up Android SDK
        if: steps.should_build.outputs.build == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        if: steps.should_build.outputs.build == 'true'
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      # ============================================================
      # WebSocket Danmaku tests
      # ============================================================
      - name: Run WebSocket danmaku tests
        if: steps.should_build.outputs.build == 'true'
        run: |
          chmod +x ./gradlew

          ./gradlew \
            :app:testMobileArm64_v8aDebugUnitTest \
            --tests 'com.fongmi.android.tv.player.danmaku.*' \
            --no-daemon

      # ============================================================
      # Resolve release tag
      # ============================================================
      - name: Resolve release tag
        if: steps.should_build.outputs.build == 'true'
        id: meta
        run: |
          VERSION_NAME="$(
            sed -n \
              's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' \
              app/build.gradle \
              | head -1
          )"

          VERSION_CODE="$(
            sed -n \
              's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
              app/build.gradle \
              | head -1
          )"

          CHANNEL="${{ inputs.release_channel }}"

          if [ "$CHANNEL" = "auto" ] || [ -z "$CHANNEL" ]; then
            if [ "${{ github.ref_name }}" = "fongmi-sync" ]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi

          if [ "$CHANNEL" = "beta" ]; then
            APK_SUFFIX="-beta"
            TAG_PATTERN="^v${VERSION_NAME}-beta-[0-9]{12}$"
            TAG_DEFAULT="v${VERSION_NAME}-beta-$(date +%Y%m%d%H%M)"
            TAG_EXPECT="v${VERSION_NAME}-beta-yyyyMMddHHmm"
          else
            APK_SUFFIX=""
            TAG_PATTERN="^v${VERSION_NAME}-[0-9]{12}$"
            TAG_DEFAULT="v${VERSION_NAME}-$(date +%Y%m%d%H%M)"
            TAG_EXPECT="v${VERSION_NAME}-yyyyMMddHHmm"
          fi

          TAG="${{ inputs.release_tag }}"

          if [ -z "$TAG" ]; then
            TAG="$TAG_DEFAULT"
          fi

          if ! printf '%s' "$TAG" | grep -Eq "$TAG_PATTERN"; then
            echo "::error title=Invalid release tag::Expected $TAG_EXPECT, got: $TAG"
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error title=Release tag exists::$TAG already exists"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "title=${TAG#v}"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
            echo "channel=$CHANNEL"
            echo "apk_suffix=$APK_SUFFIX"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # Configure release signing
      # ============================================================
      - name: Configure release signing
        if: steps.should_build.outputs.build == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_BASE64="${RELEASE_KEYSTORE_BASE64:-$KEYSTORE_BASE64}"
          STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-$KEY_PASSWORD}"
          ALIAS="${RELEASE_KEY_ALIAS:-$KEY_ALIAS}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-$STORE_PASSWORD}"

          if [ -z "$KS_BASE64" ] \
            || [ -z "$STORE_PASSWORD" ] \
            || [ -z "$ALIAS" ]; then

            echo "::error title=Release signing not configured::Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEY_ALIAS and RELEASE_STORE_PASSWORD."

            exit 1
          fi

          mkdir -p app/signing

          printf '%s' "$KS_BASE64" \
            | base64 --decode \
            > app/signing/release.jks

          {
            echo "storeFile=$GITHUB_WORKSPACE/app/signing/release.jks"
            echo "keyAlias=$ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASS"
          } > local.properties

          echo "Release signing configured"

      # ============================================================
      # Build four release APKs
      # ============================================================
      - name: Build four release APKs
        if: steps.should_build.outputs.build == 'true'
        env:
          WEBHTV_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          WEBHTV_APK_SUFFIX: ${{ steps.meta.outputs.apk_suffix }}
        run: |
          chmod +x ./gradlew

          rm -rf Release/apk

          ./gradlew \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleMobileArmeabi_v7aRelease \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleLeanbackArmeabi_v7aRelease \
            --no-daemon

      # ============================================================
      # Collect artifacts
      # ============================================================
      - name: Collect artifacts
        if: steps.should_build.outputs.build == 'true'
        run: |
          rm -rf dist
          mkdir -p dist

          cp Release/apk/*.apk dist/

          echo "=========================================="
          echo "APK:"
          echo "=========================================="

          ls -lh dist/

      # ============================================================
      # Prepare release notes
      # - 手动 inputs.release_notes 优先
      # - 自动附带上游 fish2018/webhtv 最新 Release 说明
      # ============================================================
      - name: Prepare release notes input
        if: steps.should_build.outputs.build == 'true'
        id: release_notes
        env:
          RELEASE_NOTES_RAW: ${{ inputs.release_notes }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          UPSTREAM_OWNER: fish2018
          UPSTREAM_REPO_NAME: webhtv
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          def normalize(raw: str) -> str:
              return (
                  (raw or "")
                  .strip()
                  .replace("\\r\\n", "\n")
                  .replace("\\n", "\n")
                  .replace("\\t", "\t")
                  .replace('\\"', '"')
                  .replace("\\'", "'")
              )

          def fetch_upstream_notes():
              owner = os.environ.get("UPSTREAM_OWNER", "fish2018")
              repo = os.environ.get("UPSTREAM_REPO_NAME", "webhtv")
              token = os.environ.get("GH_TOKEN", "").strip()

              try:
                  cmd = [
                      "gh", "api",
                      f"repos/{owner}/{repo}/releases/latest",
                      "--jq", '.tag_name + "\n" + (.body // "")',
                  ]
                  out = subprocess.check_output(cmd, text=True, timeout=30)
                  lines = out.splitlines()
                  if lines:
                      tag = lines[0].strip()
                      body = "\n".join(lines[1:]).strip()
                      if body:
                          return tag, body
              except Exception as e:
                  print(f"[notes] gh api failed: {e}")

              try:
                  headers = {
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "klcb-webhtv-release",
                  }
                  if token:
                      headers["Authorization"] = f"Bearer {token}"
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{owner}/{repo}/releases/latest",
                      headers=headers,
                  )
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                  tag = (data.get("tag_name") or "").strip()
                  body = (data.get("body") or "").strip()
                  return tag, body
              except Exception as e:
                  print(f"[notes] urllib failed: {e}")
                  return "", ""

          manual = normalize(os.environ.get("RELEASE_NOTES_RAW", ""))
          up_tag, up_body = fetch_upstream_notes()

          parts = []
          if manual:
              parts.append(manual)
          else:
              parts.append("基于鱼壳同步构建的魔改版")

          if up_body:
              parts.append("")
              parts.append("---")
              parts.append("")
              if up_tag:
                  parts.append(f"### 上游更新（fish2018/webhtv {up_tag}）")
              else:
                  parts.append("### 上游更新（fish2018/webhtv）")
              parts.append("")
              parts.append(up_body)
          else:
              print("[notes] upstream release body empty, skip attach")

          notes = "\n".join(parts).strip()
          if not notes:
              notes = "手动触发 GitHub Actions 构建发布。"

          delimiter = "RELEASE_NOTES_EOF"
          while delimiter in notes:
              delimiter += "_"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_notes={'true' if notes else 'false'}\n")
              fh.write(f"upstream_tag={up_tag}\n")
              fh.write(f"notes<<{delimiter}\n")
              fh.write(notes)
              if not notes.endswith("\n"):
                  fh.write("\n")
              fh.write(f"{delimiter}\n")

          print("==========================================")
          print("Release notes preview:")
          print("==========================================")
          print(notes[:2000])
          print("==========================================")
          PY

      # ============================================================
      # Generate update manifests
      # ============================================================
      - name: Generate update manifests
        if: steps.should_build.outputs.build == 'true'
        env:
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
          GITHUB_RELEASE_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}
        run: |
          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os

          tag = "${{ steps.meta.outputs.tag }}"
          notes = os.environ.get("RELEASE_NOTES", "").strip()
          release_download_base = os.environ["GITHUB_RELEASE_DOWNLOAD_BASE"]

          for apk in glob.glob("dist/*.apk"):
              base = os.path.splitext(
                  os.path.basename(apk)
              )[0]

              with open(apk, "rb") as fh:
                  content = fh.read()

              data = {
                  "name": tag,
                  "desc": f"{tag} - ${{ steps.meta.outputs.short_sha }}",
                  "channel": "${{ steps.meta.outputs.channel }}",
                  "code": int("${{ steps.meta.outputs.version_code }}"),
                  "apk": f"{release_download_base}/{base}.apk",
                  "size": len(content),
                  "sha256": hashlib.sha256(content).hexdigest(),
              }

              if notes:
                  data["notes"] = notes

              with open(
                  f"dist/{base}.json",
                  "w",
                  encoding="utf-8"
              ) as fh:
                  json.dump(
                      data,
                      fh,
                      ensure_ascii=False,
                      indent=2
                  )

                  fh.write("\n")
          PY

          echo "=========================================="
          echo "Release manifests:"
          echo "=========================================="

          ls -lh dist/

      # ============================================================
      # Create GitHub Release
      #
      # 重要：
      #
      # --repo "${GITHUB_REPOSITORY}"
      #
      # 强制指定目标仓库为：
      #
      # klcb2010/webhtv
      #
      # 即使存在 upstream remote，也不会去：
      #
      # fish2018/webhtv/releases
      # ============================================================
      - name: Create GitHub Release
        if: steps.should_build.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        run: |
          set -e

          PRERELEASE_FLAG=""

          if [ "${{ inputs.prerelease }}" = "true" ] \
            || [ "${{ steps.meta.outputs.channel }}" = "beta" ]; then

            PRERELEASE_FLAG="--prerelease"
          fi

          NOTES="${RELEASE_NOTES:-手动触发 GitHub Actions 构建发布。}"

          echo "=========================================="
          echo "创建 GitHub Release"
          echo "=========================================="
          echo "目标仓库: ${GITHUB_REPOSITORY}"
          echo "Tag: ${{ steps.meta.outputs.tag }}"
          echo "Title: ${{ steps.meta.outputs.title }}"
          echo "Channel: ${{ steps.meta.outputs.channel }}"
          echo "=========================================="

          gh release create \
            "${{ steps.meta.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes "$NOTES" \
            $PRERELEASE_FLAG \
            dist/*.apk \
            dist/*.json

          echo ""
          echo "=========================================="
          echo "✅ GitHub Release 创建成功"
          echo "=========================================="

      # ============================================================
      # Sync to CNB
      # ============================================================
      - name: Sync to CNB
        if: steps.should_build.outputs.build == 'true' && inputs.sync_cnb
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          CNB_RELEASE_TITLE: ${{ steps.meta.outputs.title }}
          CNB_RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
          CNB_RELEASE_PRERELEASE: ${{ inputs.prerelease == true || steps.meta.outputs.channel == 'beta' }}
          CNB_RELEASE_LATEST: ${{ steps.meta.outputs.channel == 'stable' }}
        run: |
          .github/scripts/sync-cnb-release.sh

      # ============================================================
      # Upload workflow artifacts
      # ============================================================
      - name: Upload workflow artifacts
        if: steps.should_build.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-${{ steps.meta.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

