name: Android no Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, blank = v<versionName>-yyyyMMddHHmm or v<versionName>-beta-yyyyMMddHHmm"
        required: false
        type: string

      release_channel:
        description: "Release channel, auto uses beta on fongmi-sync"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - beta

      release_notes:
        description: "Release notes, use \\n for Markdown newlines"
        required: false
        type: string

      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

      sync_cnb:
        description: "Mirror APKs to CNB Release and sync CNB manifests"
        required: false
        default: false
        type: boolean

      force_build:
        description: "Force build even if upstream has no new Release (manual only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  CNB_API_ENDPOINT: https://api.cnb.cool
  CNB_WEB_ENDPOINT: https://cnb.cool
  CNB_REPO_SLUG: fish2035/webhtv-release
  CNB_REPO_URL: https://cnb.cool/fish2035/webhtv-release.git
  UPSTREAM_REPO: https://github.com/fish2018/webhtv.git
  UPSTREAM_BRANCH: main

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || github.token }}
          persist-credentials: true

      # ============================================================
      # 2. Setup Java & Gradle Environment
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ============================================================
      # 3. Check and sync upstream
      # ============================================================
      - name: Check and sync upstream
        id: upstream_sync
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          set -e

          echo "synced=false" >> "$GITHUB_OUTPUT"
          echo "reason=init" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "检查上游更新"
          echo "=========================================="
          echo "当前仓库 : ${GITHUB_REPOSITORY}"
          echo "当前分支 : ${GITHUB_REF_NAME}"
          echo "上游仓库 : ${UPSTREAM_REPO}"
          echo "上游分支 : ${UPSTREAM_BRANCH}"
          echo "=========================================="

          CURRENT_BRANCH="${GITHUB_REF_NAME}"

          if [ -z "$CURRENT_BRANCH" ]; then
            echo "❌ 无法确定当前分支"
            exit 1
          fi

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_REPO"

          echo "获取上游源码..."
          git fetch --no-tags --prune upstream "$UPSTREAM_BRANCH"

          CURRENT_SHA="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse "upstream/$UPSTREAM_BRANCH")"

          echo "当前 HEAD : $CURRENT_SHA"
          echo "上游 HEAD : $UPSTREAM_SHA"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "✅ 上游没有新的提交"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=upstream-already-merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 取最新非 draft Release
          RELEASE_JSON="$(
            gh api "repos/fish2018/webhtv/releases?per_page=10" \
              --jq '[.[] | select(.draft == false)] | .[0] // empty' \
              2>/dev/null || true
          )"

          if [ -z "$RELEASE_JSON" ] || [ "$RELEASE_JSON" = "null" ]; then
            echo "⏳ 上游尚无可用 GitHub Release → 跳过同步"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-upstream-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_TAG="$(printf '%s' "$RELEASE_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("tag_name") or "")')"

          if [ -z "$RELEASE_TAG" ]; then
            echo "⏳ 无法解析 Release tag → 跳过同步"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=bad-release-tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch upstream "refs/tags/${RELEASE_TAG}:refs/tags/upstream-rel-${RELEASE_TAG}" 2>/dev/null || true

          REL_SHA="$(git rev-parse "upstream-rel-${RELEASE_TAG}^{commit}" 2>/dev/null || echo "")"

          if [ -z "$REL_SHA" ]; then
            echo "⏳ 无法解析 Release 对应提交 → 跳过同步"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=cannot-resolve-release-sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$UPSTREAM_SHA" = "$REL_SHA" ] || git merge-base --is-ancestor "$UPSTREAM_SHA" "$REL_SHA" 2>/dev/null; then
            echo "✅ 上游已就绪，开始同步"
          else
            echo "⏳ 上游 main 比最新 Release 更新或分叉 → 跳过同步"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=main-ahead-or-diverged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 备份保护文件
          rm -rf /tmp/webhtv-protected
          mkdir -p /tmp/webhtv-protected
          [ -f README.md ] && cp -a README.md /tmp/webhtv-protected/
          [ -d mod ] && cp -a mod /tmp/webhtv-protected/
          [ -f .github/workflows/android-release.yml ] && mkdir -p /tmp/webhtv-protected/workflows && cp -a .github/workflows/android-release.yml /tmp/webhtv-protected/workflows/

          # 同步源码
          rm -rf /tmp/webhtv-upstream
          mkdir -p /tmp/webhtv-upstream
          git archive "upstream/$UPSTREAM_BRANCH" | tar -x -C /tmp/webhtv-upstream

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='README.md' \
            --exclude='mod/' \
            --exclude='.github/workflows/android-release.yml' \
            /tmp/webhtv-upstream/ ./

          # 还原保护文件
          [ -f /tmp/webhtv-protected/README.md ] && cp -a /tmp/webhtv-protected/README.md README.md
          [ -d /tmp/webhtv-protected/mod ] && rm -rf mod && cp -a /tmp/webhtv-protected/mod mod
          [ -f /tmp/webhtv-protected/workflows/android-release.yml ] && cp -a /tmp/webhtv-protected/workflows/android-release.yml .github/workflows/android-release.yml

          git add -A

          if git diff --cached --quiet; then
            echo "✅ 保护文件后没有实际变化，跳过提交"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-file-change-after-protect" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync upstream fish2018/webhtv (${RELEASE_TAG})"
          git push origin "HEAD:$CURRENT_BRANCH"

          echo "synced=true" >> "$GITHUB_OUTPUT"
          echo "reason=synced-${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "upstream_release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. Decide whether to build
      # ============================================================
      - name: Decide whether to build
        id: should_build
        run: |
          set -e
          EVENT="${{ github.event_name }}"
          SYNCED="${{ steps.upstream_sync.outputs.synced }}"
          FORCE="${{ inputs.force_build }}"

          if [ "$EVENT" = "schedule" ]; then
            if [ "$SYNCED" != "true" ]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "reason=schedule-no-upstream-sync" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=schedule-upstream-synced" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$FORCE" = "true" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "reason=force-build" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "reason=manual-build" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "reason=default-build" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. Apply mod patches
      # ============================================================
      - name: Apply mod patches
        if: steps.should_build.outputs.build == 'true'
        run: |
          if [ -f mod/apply.sh ]; then
            chmod +x mod/apply.sh
            bash mod/apply.sh
          fi

      # ============================================================
      # 6. Resolve release tag
      # ============================================================
      - name: Resolve release tag
        if: steps.should_build.outputs.build == 'true'
        id: meta
        run: |
          VERSION_NAME=$(grep -E 'versionName[[:space:]]*=?[[:space:]]*"[^"]+"' app/build.gradle* | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="5.6.0"
          fi

          CHANNEL="${{ inputs.release_channel }}"
          if [ "$CHANNEL" = "auto" ] || [ -z "$CHANNEL" ]; then
            if [ "${{ github.ref_name }}" = "fongmi-sync" ]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi

          if [ "$CHANNEL" = "beta" ]; then
            TAG_DEFAULT="v${VERSION_NAME}-beta-$(date +%Y%m%d%H%M)"
          else
            TAG_DEFAULT="v${VERSION_NAME}-$(date +%Y%m%d%H%M)"
          fi

          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$TAG_DEFAULT"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. Build APKs with Gradle
      # ============================================================
      - name: Build APKs
        if: steps.should_build.outputs.build == 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # ============================================================
      # 8. Collect APK & JSON files to release directory
      # ============================================================
      - name: Prepare Release Output
        if: steps.should_build.outputs.build == 'true'
        run: |
          mkdir -p release
          find app/build/outputs/ -type f \( -name "*.apk" -o -name "*.json" \) -exec cp {} release/ \;
          ls -lh release/

      # ============================================================
      # 9. Upload Artifacts Only (不调用任何 Release API)
      # ============================================================
      - name: Upload Artifact
        if: steps.should_build.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-${{ steps.meta.outputs.tag }}
          path: release/*
          if-no-files-found: error
